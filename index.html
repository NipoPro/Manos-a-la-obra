<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2F4858">
<title>Manos a la Obra — Servicios de confianza</title>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=Zilla+Slab:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&display=swap');
  :root{
    --ink:#20303A; --paper:#F5F2EA; --steel:#2F4858; --steel-dark:#1D2C36; --steel-shadow:#101a20;
    --gold:#E2A33D; --gold-deep:#C4841F; --gold-shadow:#8f5f12;
    --forest:#3B6E52; --forest-deep:#2C5540; --forest-shadow:#1c3d2c;
    --brick:#B4452A; --brick-shadow:#7a2e1a; --line:#DDD6C4; --white:#FFFFFF; --sky:#4A7C8C;
    --purple:#6B4E9E; --purple-deep:#4F3A78;
    --edit-bg:#eaf2f4; --edit-border:#4A7C8C;
    --warn-bg:#f6ecd8; --warn-border:#e2c98a; --warn-text:#8a6416;
    --meta-color:#5b6b74;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Work Sans',sans-serif;color:var(--ink);background-color:var(--paper);background-image:radial-gradient(rgba(32,48,58,.05) 1px,transparent 1px);background-size:22px 22px;line-height:1.55;}
  h1,h2,h3{font-family:'Zilla Slab',serif;margin:0 0 .4em 0;font-weight:700;color:var(--steel);}
  a{color:inherit;}
  header.top{background:linear-gradient(135deg,#0f1a20,#2F4858 60%,#1D2C36);color:var(--paper);padding:18px 22px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;box-shadow:0 4px 20px rgba(0,0,0,.3);}
  header.top .brand{display:flex;align-items:center;gap:16px;}
  header.top .brand .logo3d{width:62px;height:62px;border-radius:18px;background:radial-gradient(circle at 30% 25%,#FFF3C4 0%,#F5C842 20%,#E2A33D 55%,#C4841F 100%);box-shadow:0 7px 0 #8f5f12,0 9px 0 #6e4a0e,0 14px 30px rgba(0,0,0,.45),inset 0 -3px 6px rgba(0,0,0,.25),inset 0 3px 6px rgba(255,255,255,.5);display:flex;align-items:center;justify-content:center;position:relative;transition:transform .18s;border:1px solid rgba(255,255,255,.35);}
  header.top .brand .logo3d::before{content:'';position:absolute;top:4px;left:8px;right:8px;height:40%;background:linear-gradient(180deg,rgba(255,255,255,.45),transparent);border-radius:12px 12px 50% 50%;pointer-events:none;}
  header.top .brand .logo3d svg{position:relative;z-index:1;width:38px;height:38px;}
  header.top h1{color:var(--paper);font-size:2rem;margin:0;font-family:'Playfair Display',serif;font-weight:800;letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.35);}
  header.top h1 .amp{color:#F5C842;font-style:italic;}
  header.top span.tag{font-size:.82rem;opacity:.85;display:block;margin-top:2px;letter-spacing:.3px;}
  .header-right{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .notif-bell{position:relative;background:rgba(255,255,255,.14);border:none;color:var(--paper);width:42px;height:42px;border-radius:50%;cursor:pointer;font-size:1.15rem;transition:background .15s;}
  .notif-bell:hover{background:rgba(255,255,255,.24);}
  .notif-badge{position:absolute;top:-2px;right:-2px;background:var(--brick);color:white;font-size:.7rem;font-weight:700;min-width:20px;height:20px;padding:0 5px;border-radius:10px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.35);border:2px solid #1D2C36;}
  nav.tabs{display:flex;gap:8px;flex-wrap:wrap;background:var(--white);border-bottom:1px solid var(--line);padding:12px 18px;position:sticky;top:0;z-index:5;box-shadow:0 2px 8px rgba(0,0,0,.04);}
  nav.tabs button{background:none;border:none;padding:11px 18px;font-family:'Work Sans',sans-serif;font-size:1.02rem;font-weight:600;color:var(--steel);cursor:pointer;border-radius:8px;transition:all .15s;}
  nav.tabs button:hover{background:#f0ece0;transform:translateY(-1px);}
  nav.tabs button.active{background:linear-gradient(180deg,#F0B454,var(--gold));color:#20303A;box-shadow:0 3px 0 var(--gold-shadow);transform:translateY(-1px);}
  main{max-width:820px;margin:0 auto;padding:20px 16px 90px;}
  .card{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px;box-shadow:0 2px 6px rgba(32,48,58,.06);}
  label{display:block;font-size:.9rem;font-weight:700;margin:12px 0 5px;color:var(--ink);letter-spacing:.2px;}
  input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;font-family:'Work Sans',sans-serif;font-size:.95rem;background:var(--paper);color:var(--ink);}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--sky);outline-offset:1px;}
  textarea{resize:vertical;min-height:60px;}
  .btn{display:inline-block;color:var(--white);border:none;padding:12px 22px;border-radius:10px;font-weight:700;font-size:.95rem;cursor:pointer;margin-top:12px;background:linear-gradient(180deg,var(--forest) 0%,var(--forest-deep) 100%);box-shadow:0 4px 0 var(--forest-shadow),0 6px 14px rgba(32,48,58,.22);transition:transform .07s,box-shadow .07s,filter .15s;}
  .btn:hover{filter:brightness(1.06);}
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--forest-shadow);}
  .btn.secondary{background:linear-gradient(180deg,var(--steel) 0%,var(--steel-dark) 100%);box-shadow:0 4px 0 var(--steel-shadow);}
  .btn.warn{background:linear-gradient(180deg,var(--brick) 0%,#8f3620 100%);box-shadow:0 4px 0 var(--brick-shadow);}
  .btn.gold{background:linear-gradient(180deg,#F0B454 0%,var(--gold) 100%);color:#20303A;box-shadow:0 4px 0 var(--gold-shadow);}
  .btn.ghost{background:var(--white);color:var(--steel);border:1px solid var(--line);box-shadow:0 2px 0 var(--line);}
  .btn.purple{background:linear-gradient(180deg,var(--purple) 0%,var(--purple-deep) 100%);box-shadow:0 4px 0 #352555;}
  .btn.big{padding:16px 28px;font-size:1.05rem;letter-spacing:.5px;}
  .btn:disabled{opacity:.4;cursor:not-allowed;filter:none !important;transform:none !important;}
  .btn-sm{padding:7px 14px;font-size:.82rem;margin-top:6px;}
  .badge{display:inline-block;font-size:.72rem;font-weight:700;padding:4px 11px;border-radius:20px;margin-left:6px;}
  .badge.ok{background:#e3efe8;color:var(--forest-deep);}
  .badge.pending{background:#f6ecd8;color:#8a6416;}
  .badge.gray{background:var(--brick);color:#FFFFFF;font-weight:700;border:1px solid #7a2e1a;}
  .badge.red{background:#fbeceb;color:var(--brick);}
  .badge.soporte{background:#ece4f7;color:var(--purple-deep);}
  .badge.active{background:#d4edda;color:#155724;border:1px solid var(--forest);}
  .badge.inactive{background:var(--brick);color:#FFFFFF;border:1px solid #7a2e1a;font-weight:700;}
  .avatar{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Zilla Slab',serif;font-weight:700;color:#fff;font-size:1rem;flex-shrink:0;box-shadow:0 2px 4px rgba(0,0,0,.15);object-fit:cover;}
  .avatar.sm{width:32px;height:32px;font-size:.8rem;}
  .avatar-lg{width:130px;height:160px;border-radius:10px;object-fit:cover;border:3px solid var(--gold);box-shadow:0 6px 16px rgba(0,0,0,.22);background:#fff;}
  .avatar-lg-placeholder{width:130px;height:160px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-weight:800;font-size:3rem;color:#fff;border:3px solid var(--gold);box-shadow:0 6px 16px rgba(0,0,0,.22);}
  .avatar-soporte{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--purple),var(--purple-deep));color:#fff;font-weight:700;font-size:1.2rem;flex-shrink:0;box-shadow:0 2px 6px rgba(107,78,158,.4);}
  .avatar-soporte.sm{width:32px;height:32px;font-size:.9rem;}
  .dot-online{display:inline-block;width:9px;height:9px;border-radius:50%;background:#43c463;box-shadow:0 0 0 3px rgba(67,196,99,.22);margin-right:5px;vertical-align:middle;}
  .dot-offline{display:inline-block;width:9px;height:9px;border-radius:50%;background:#b8c0c5;margin-right:5px;vertical-align:middle;}
  .badge-tipo{display:inline-block;font-family:'Zilla Slab',serif;font-weight:700;font-size:.85rem;padding:5px 14px;border-radius:8px;letter-spacing:.6px;text-transform:uppercase;}
  .badge-tipo.cliente{background:#e7eef1;color:#2f6a7c;border:1px solid #bcd4da;}
  .badge-tipo.profesional{background:#fbeed7;color:var(--gold-shadow);border:1px solid #f0d29c;}
  .badge-tipo.soporte{background:#ece4f7;color:var(--purple-deep);border:1px solid #c7b8e3;}
  .check-icon{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;font-size:.75rem;font-weight:700;margin-left:6px;}
  .check-icon.green{background:#e3efe8;color:var(--forest-deep);border:1.5px solid var(--forest);}
  .check-icon.red{background:#fbeceb;color:var(--brick);border:1.5px solid var(--brick);}
  .estado-servicio{display:inline-block;padding:4px 12px;border-radius:20px;font-size:.78rem;font-weight:700;}
  .estado-servicio.activo{background:#fff3cd;color:#856404;}
  .estado-servicio.completado{background:#d4edda;color:#155724;}
  .estado-servicio.cancelado{background:#f8d7da;color:#721c24;}
  .msg{padding:9px 12px;border-radius:10px;margin-bottom:7px;max-width:80%;font-size:.9rem;white-space:pre-wrap;}
  .msg.mine{background:var(--forest);color:white;margin-left:auto;text-align:right;border-bottom-right-radius:2px;}
  .msg.mine.soporte{background:var(--purple);}
  .msg.theirs{background:var(--paper);border:1px solid var(--line);border-bottom-left-radius:2px;color:var(--ink);}
  .msg.theirs.soporte{background:#ece4f7;border-color:#c7b8e3;}
  .msg.sistema{background:var(--warn-bg);border:1px dashed var(--gold);text-align:center;font-style:italic;font-size:.82rem;color:var(--warn-text);margin:8px auto;max-width:90%;}
  .notice{background:var(--warn-bg);border:1px solid var(--warn-border);padding:12px 14px;border-radius:8px;font-size:.85rem;margin-bottom:14px;color:var(--warn-text);}
  .tip{background:var(--edit-bg);border:1px solid var(--edit-border);padding:12px 14px;border-radius:8px;font-size:.85rem;margin-bottom:14px;display:flex;justify-content:space-between;gap:10px;align-items:flex-start;color:var(--ink);}
  .tip button{background:none;border:none;color:var(--sky);font-weight:700;cursor:pointer;font-size:.9rem;flex-shrink:0;}
  .empty{color:var(--meta-color);font-style:italic;padding:14px 0;}
  footer{text-align:center;font-size:.8rem;color:var(--meta-color);padding:20px 20px 70px;}
  .pill{display:inline-block;background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:6px 12px;font-size:.8rem;margin:2px 4px 2px 0;cursor:pointer;transition:background .12s;color:var(--ink);}
  .pill:hover{background:#efe9d8;}
  .pill.on{background:var(--gold);border-color:var(--gold);font-weight:700;color:#20303A;}
  .pill.soporte{background:#ece4f7;border-color:#c7b8e3;color:var(--purple-deep);font-weight:700;}
  .hero{background:linear-gradient(135deg,var(--steel-dark),var(--sky));color:var(--paper);border-radius:14px;padding:28px 24px;margin-bottom:18px;}
  .hero h2{color:var(--paper);font-size:1.55rem;font-family:'Playfair Display',serif;}
  .hero p{margin:0 0 14px;opacity:.92;max-width:46ch;}
  .stats{display:flex;gap:20px;flex-wrap:wrap;margin-top:14px;}
  .stats .num{font-family:'Zilla Slab',serif;font-size:1.5rem;font-weight:700;color:var(--gold);}
  .stats .lbl{font-size:.75rem;opacity:.85;}
  .steps3{display:flex;gap:14px;flex-wrap:wrap;margin-top:6px;}
  .steps3 > div{flex:1;min-width:150px;background:rgba(255,255,255,.08);border-radius:8px;padding:12px;}
  .steps3 .n{font-family:'Zilla Slab',serif;font-weight:700;color:var(--gold);font-size:1.1rem;}
  .starpicker{font-size:1.9rem;cursor:pointer;letter-spacing:3px;}
  .starpicker span{color:#d8d2c2;}
  .starpicker span.sel{color:var(--gold-deep);}
  .starpicker-big{font-size:3.5rem;cursor:pointer;letter-spacing:6px;text-align:center;margin:20px 0;}
  .starpicker-big span{color:#d8d2c2;transition:color .15s;}
  .starpicker-big span.sel{color:var(--gold-deep);text-shadow:0 0 12px rgba(226,163,61,.6);}
  .stars-display{color:var(--gold-deep);font-weight:700;font-size:1rem;letter-spacing:1px;}
  .stars-display .count{color:var(--meta-color);font-weight:500;font-size:.85rem;margin-left:4px;}
  .portafolio-fotos{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
  .portafolio-fotos img{width:76px;height:76px;object-fit:cover;border-radius:8px;border:1px solid var(--line);}
  .checklist{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-top:10px;}
  .checklist label{font-weight:400;font-size:.85rem;}
  .switch{position:relative;display:inline-block;width:44px;height:24px;}
  .switch input{opacity:0;width:0;height:0;}
  .slider{position:absolute;cursor:pointer;inset:0;background:#cfd6da;border-radius:24px;transition:.2s;}
  .slider:before{position:absolute;content:"";height:18px;width:18px;left:3px;bottom:3px;background:white;border-radius:50%;transition:.2s;}
  .switch input:checked + .slider{background:var(--forest);}
  .switch input:checked + .slider:before{transform:translateX(20px);}
  .quick-tpl{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
  .quick-tpl button{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:6px 12px;font-size:.78rem;cursor:pointer;color:var(--steel);}
  .quick-tpl button:hover{background:#efe9d8;}
  .quick-tpl button.soporte{background:#ece4f7;border-color:#c7b8e3;color:var(--purple-deep);}
  .skeleton{background:linear-gradient(90deg,#eee 25%,#e0dccc 37%,#eee 63%);background-size:400% 100%;animation:sk 1.4s ease infinite;border-radius:8px;height:14px;margin:8px 0;}
  @keyframes sk{0%{background-position:100% 50%;}100%{background-position:0 50%;}}
  .onboard-overlay{position:fixed;inset:0;background:rgba(20,26,31,.94);display:flex;align-items:center;justify-content:center;z-index:120;padding:20px;}
  .onboard-card{background:var(--paper);max-width:420px;width:100%;padding:28px;border-radius:16px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.4);color:var(--ink);}
  .onboard-card .ob-icon{font-size:3.5rem;margin-bottom:6px;}
  .onboard-dots{display:flex;gap:6px;justify-content:center;margin:14px 0;}
  .onboard-dots span{width:9px;height:9px;border-radius:50%;background:#ccc;}
  .onboard-dots span.on{background:var(--gold);}
  #app.fadein{animation:fadeIn .28s ease;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  #toastWrap{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;}
  .toast{background:var(--steel-dark);color:var(--paper);padding:11px 20px;border-radius:30px;font-size:.85rem;font-weight:600;box-shadow:0 8px 20px rgba(0,0,0,.28);animation:toastIn .25s,toastOut .25s 3s forwards;max-width:90vw;text-align:center;}
  .toast.success{background:var(--forest-deep);}
  .toast.error{background:var(--brick);}
  .toast.warn{background:var(--gold-deep);color:#1D2C36;}
  .toast.soporte{background:var(--purple-deep);}
  @keyframes toastIn{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
  @keyframes toastOut{to{opacity:0;transform:translateY(-8px);}}
  .theme-toggle{background:rgba(255,255,255,.14);border:none;color:var(--paper);width:42px;height:42px;border-radius:50%;cursor:pointer;font-size:1.1rem;flex-shrink:0;transition:background .15s;}
  .theme-toggle:hover{background:rgba(255,255,255,.24);}
  .dbstatus{font-size:.72rem;padding:3px 9px;border-radius:20px;font-weight:700;}
  .dbstatus.on{background:#e3efe8;color:var(--forest-deep);}
  .dbstatus.off{background:#f6ecd8;color:#8a6416;}
  .banner-warn{background:var(--warn-bg);border:2px solid var(--gold);padding:14px 16px;border-radius:10px;margin-bottom:14px;font-size:.88rem;font-weight:600;color:var(--warn-text);display:flex;align-items:center;gap:12px;}
  .banner-warn .ico{font-size:1.5rem;flex-shrink:0;}
  .banner-warn a{color:inherit;text-decoration:underline;}
  .verif-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-top:1px solid var(--line);}
  .verif-row:first-child{border-top:none;}
  .verif-row .info{flex:1;}
  .verif-row .info b{display:block;font-family:'Zilla Slab',serif;font-size:1rem;color:var(--ink);}
  .verif-row .info span{font-size:.82rem;color:var(--meta-color);}
  .photo-note{background:var(--edit-bg);border-left:4px solid var(--sky);padding:10px 14px;border-radius:6px;font-size:.82rem;color:var(--ink);margin-top:8px;line-height:1.5;}
  .reset-bar{text-align:center;margin:14px 0;}
  .admin-decision{display:inline-flex;gap:6px;align-items:center;margin-left:6px;}
  .decision-btn{border:none;width:32px;height:32px;border-radius:8px;cursor:pointer;font-weight:700;font-size:1rem;}
  .decision-btn.ok{background:#e3efe8;color:var(--forest-deep);border:1px solid var(--forest);}
  .decision-btn.no{background:#fbeceb;color:var(--brick);border:1px solid var(--brick);}
  .decision-btn.ok.active{background:var(--forest);color:#fff;}
  .decision-btn.no.active{background:var(--brick);color:#fff;}
  .panel-edit{background:var(--edit-bg);border:2px solid var(--edit-border);border-radius:12px;padding:20px;margin-bottom:16px;}
  .panel-edit h3{color:var(--steel);}
  .fab-soporte{position:fixed;bottom:90px;right:22px;z-index:70;background:linear-gradient(135deg,var(--purple),var(--purple-deep));color:#fff;border:none;width:62px;height:62px;border-radius:50%;cursor:grab;font-size:1.6rem;box-shadow:0 6px 0 #352555,0 10px 24px rgba(0,0,0,.35);transition:transform .15s,box-shadow .15s;display:flex;align-items:center;justify-content:center;touch-action:none;user-select:none;}
  .fab-soporte:hover{transform:translateY(-2px);box-shadow:0 8px 0 #352555,0 14px 28px rgba(0,0,0,.4);}
  .fab-soporte:active{cursor:grabbing;}
  .fab-soporte.arrastrando{transform:scale(1.08);box-shadow:0 10px 0 #352555,0 16px 32px rgba(0,0,0,.5);transition:none;}
  .fab-soporte .badge-fab{position:absolute;top:-3px;right:-3px;background:var(--brick);color:#fff;font-size:.68rem;font-weight:700;min-width:22px;height:22px;padding:0 6px;border-radius:11px;display:flex;align-items:center;justify-content:center;border:2px solid var(--paper);}
  .msg-input-wrap{display:flex;gap:8px;margin-top:8px;align-items:flex-start;}
  .msg-input-wrap input{flex:1;}
  .admin-edit-panel{background:#f6ecd8;border:2px solid var(--gold);border-radius:12px;padding:16px;margin-top:12px;}
  .admin-edit-panel h4{margin:0 0 8px;color:var(--gold-shadow);font-family:'Zilla Slab',serif;}
  .card-danger{background:#fbeceb;border:2px solid var(--brick);}
  body[data-tema="oscuro"] .card-danger{background:#3a1a1a !important;border-color:#EF9A9A !important;}
  body[data-tema="oscuro"] .card-danger h3{color:#EF9A9A !important;}
  body[data-tema="oscuro"] .card-danger p,body[data-tema="oscuro"] .card-danger span,body[data-tema="oscuro"] .card-danger li,body[data-tema="oscuro"] .card-danger b{color:#FFCDD2 !important;}
  body[data-tema="oscuro"] .card-danger .meta{color:#FFB4AB !important;}
  .card-success{background:#e3efe8;border:2px solid var(--forest);}
  body[data-tema="oscuro"] .card-success{background:#193a2a !important;border-color:#7FD9AB !important;}
  body[data-tema="oscuro"] .card-success p,body[data-tema="oscuro"] .card-success b{color:#7FD9AB !important;}
  .card-info{background:#eaf2f4;border:2px solid var(--sky);}
  body[data-tema="oscuro"] .card-info{background:#152a33 !important;border-color:#8FD0E3 !important;}
  body[data-tema="oscuro"] .card-info p,body[data-tema="oscuro"] .card-info b{color:#8FD0E3 !important;}

  }
  return email;
}

let _webpSoportado = null;
function webpSoportado(){
  if(_webpSoportado !== null) return _webpSoportado;
  try{
    const c = document.createElement('canvas');
    c.width = 1; c.height = 1;
    _webpSoportado = c.toDataURL('image/webp').indexOf('data:image/webp') === 0;
  }catch(e){ _webpSoportado = false; }
  return _webpSoportado;
}

function comprimirImagen(file, maxDim, cal){
  maxDim = maxDim || 800;
  cal = cal || 0.72;
  return new Promise(function(resolve){
    if(!file){ resolve(''); return; }
    let d = false;
    const fin = function(v){ if(!d){ d = true; resolve(v); } };
    try{
      const rd = new FileReader();
      rd.onload = function(e){
        const dd = e.target.result;
        try{
          const img = new Image();
          img.onload = function(){
            try{
              let w = img.width, h = img.height;
              if(!w || !h){ fin(dd); return; }
              if(w >= h && w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; }
              else if(h > w && h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; }
              const c = document.createElement('canvas');
              c.width = w; c.height = h;
              const ctx = c.getContext('2d');
              if(!ctx){ fin(dd); return; }
              ctx.drawImage(img, 0, 0, w, h);
              const usaWebP = webpSoportado();
              fin(c.toDataURL(usaWebP ? 'image/webp' : 'image/jpeg', cal));
            }catch(err){ fin(dd); }
          };
          img.onerror = function(){ fin(dd); };
          img.src = dd;
        }catch(err){ fin(dd); }
      };
      rd.onerror = function(){ fin(''); };
      rd.readAsDataURL(file);
      setTimeout(function(){ fin(''); }, 4000);
    }catch(err){ fin(''); }
  });
}

async function subirImagen(file, path, maxDim, calidad){
  const dataUrl = await comprimirImagen(file, maxDim || 800, calidad || 0.72);
  if(!dataUrl) return '';
  if(!FIREBASE_LISTO || !storage){ return dataUrl; }
  try{
    const res = await fetch(dataUrl);
    const blob = await res.blob();
    const sufijo = '_' + Date.now() + '_' + Math.random().toString(36).slice(2,8);
    const ext = blob.type === 'image/webp' ? '.webp' : '.jpg';
    const ruta = path + sufijo + ext;
    const ref = storage.ref().child(ruta);
    await ref.put(blob, { contentType: blob.type });
    return await ref.getDownloadURL();
  }catch(err){ return dataUrl; }
}
async function detectarImagenIA(file){ const n = (file.name||'').toLowerCase(); const pIA = ['midjourney','dalle','stable','diffusion','ai-generated','deepfake','firefly']; if(pIA.some(p=> n.includes(p))) return {esIA:true, razon:'El nombre del archivo sugiere que fue generado por IA.'}; if(file.type === 'image/png' && file.size < 50000){ const rd = new FileReader(); return new Promise(resolve=>{ rd.onload = e=>{ const data = new Uint8Array(e.target.result); const tieneEXIF = data.length > 100 && String.fromCharCode(...data.slice(0,20)).includes('Exif'); resolve({esIA: !tieneEXIF, razon: tieneEXIF ? '' : 'La imagen parece generada por IA.'}); }; rd.readAsArrayBuffer(file.slice(0, 512)); }); } return {esIA:false, razon:''}; }

async function verificarUnicidad(tel, cedula, emailExcluir){
  const users = await getUsers();
  const telLimpio = String(tel||'').replace(/\D/g,'');
  if(telLimpio.length >= 8){
    const conTel = users.find(u => String(u.tel||'').replace(/\D/g,'') === telLimpio && u.email !== emailExcluir);
    if(conTel) return { ok:false, msg:'Ese número de teléfono ya está registrado por otro usuario.' };
  }
  const cedLimpia = String(cedula||'').replace(/[\s\-\.]/g,'').toLowerCase();
  if(cedLimpia.length >= 6){
    if(FIREBASE_LISTO){
      const privados = await getPrivadoTodos();
      const conCed = privados.find(p => { const c = String(p.cedula||'').replace(/[\s\-\.]/g,'').toLowerCase(); return c === cedLimpia && p.email !== emailExcluir; });
      if(conCed) return { ok:false, msg:'Ese número de cédula ya está registrado por otro usuario.' };
    } else {
      const conCed = users.find(u => { const c = String(u.cedula||'').replace(/[\s\-\.]/g,'').toLowerCase(); return c === cedLimpia && u.email !== emailExcluir; });
      if(conCed) return { ok:false, msg:'Ese número de cédula ya está registrado por otro usuario.' };
    }
  }
  return { ok:true };
}

          btnReal.disabled = false; btnReal.textContent = 'Crear cuenta';
          if(errAuth.code === 'auth/email-already-in-use'){
            msgEl.innerHTML = '<p style="color:var(--brick)">Ese correo ya está registrado. Si olvidaste la contraseña, usa "¿Olvidaste tu contraseña?" en el login.</p>';
          } else if(errAuth.code === 'auth/weak-password'){
            msgEl.innerHTML = '<p style="color:var(--brick)">La contraseña es muy débil (mínimo 6 caracteres).</p>';
          } else {
            msgEl.innerHTML = `<p style="color:var(--brick)">Error: ${errAuth.message||errAuth}</p>`;
          }
          return;
        }
        try{ await enviarVerificacionEmail(); }catch(e){}
        try{ await db.collection('usuarios').doc(safeId(email)).delete(); }catch(e){}
        try{ await db.collection('privado').doc(safeId(email)).delete(); }catch(e){}
      } else {
        const usersLocal = await getUsers();
        if(usersLocal.find(u=>u.email===email)){
          btnReal.disabled=false; btnReal.textContent='Crear cuenta';
          msgEl.innerHTML = '<p style="color:var(--brick)">Ese correo ya está registrado.</p>'; return;
        }
        nuevo.cedula = privado.cedula; nuevo.docImagen = privado.docImagen; nuevo.cedulaImagen = privado.cedulaImagen;
        nuevo.pass = await hashPassword(pass);
      }
      const usersFinales = await getUsers();
      const usersFiltrados = usersFinales.filter(u => u.email !== email);
      usersFiltrados.push(nuevo);
      await saveUsers(usersFiltrados);
      if(FIREBASE_LISTO) await setPrivado(email, privado);
      if(FIREBASE_LISTO) await syncDirectorioPublico(email);
    }catch(err){
      btnReal.disabled = false; btnReal.textContent = 'Crear cuenta';
      msgEl.innerHTML = `<p style="color:var(--brick)">Error inesperado: ${err.message||err}</p>`;
      return;
    }

    session = {email, tipo}; usuarioActual = nuevo; currentTab = 'perfil';
    if(FIREBASE_LISTO){ toast('🎉 ¡Cuenta creada! Te enviamos un correo para verificar tu email.', 'success'); }
    else { toast('¡Cuenta creada!', 'success'); }
    if(FIREBASE_LISTO && !esEsteAdmin){
      try{
        await addMensaje({
          de: email, para: ADMIN_EMAIL,
          texto: `🆕 Nuevo registro: ${nombre} (${tipo}) — ${ciudad} · Tel: ${tel}\n\nCorreo: ${email}`,
          fecha: Date.now(), hilo: 1, leido: false
        });
      }catch(e){}
    }
    render();
  };
}

function wireLogin(){
  const linkOlvide = document.getElementById('linkOlvide');
  if(linkOlvide) linkOlvide.onclick = async (e)=>{
    e.preventDefault();
    const msgEl = document.getElementById('logMsg');
    const emailInput = prompt('Ingresa el correo con el que te registraste para enviarte un enlace de recuperación:');
    if(!emailInput) return;
    const email = normalizarEmail(emailInput.trim());
    if(!email || !email.includes('@')){ msgEl.innerHTML = '<p style="color:var(--brick)">Ingresa un correo válido.</p>'; return; }
    if(!FIREBASE_LISTO){ msgEl.innerHTML = '<p style="color:var(--brick)">Recuperación solo funciona con Firebase conectado.</p>'; return; }
    try{
      await auth.sendPasswordResetEmail(email);
      msgEl.innerHTML = '<p style="color:var(--forest);font-weight:700;">📧 Enviamos un correo a ' + email + ' con instrucciones.</p>';
      toast('📧 Correo de recuperación enviado.', 'success');
    }catch(err){
      msgEl.innerHTML = '<p style="color:var(--brick)">' + ((err.code||'').includes('user-not-found') ? 'No hay ninguna cuenta con ese correo.' : 'Error al enviar: '+(err.message||err)) + '</p>';
    }
  };
  document.getElementById('btnLogin').onclick = async ()=>{
    const email = normalizarEmail(document.getElementById('logEmail').value.trim());
    const pass = document.getElementById('logPass').value;
    const msgEl = document.getElementById('logMsg');
    const btn = document.getElementById('btnLogin');

    if(FIREBASE_LISTO){
      btn.disabled = true; btn.textContent = 'Entrando...';
      try{ await auth.signInWithEmailAndPassword(email, pass); }
      catch(err){
        const usersAux = await getUsersFresh();
        const uAux = usersAux.find(x=>x.email===email);
        if(uAux){
          uAux.intentosFallidos = (uAux.intentosFallidos||0) + 1;
          if(uAux.intentosFallidos >= MAX_INTENTOS_TOTAL){
            uAux.activo = false; uAux.desactivadoPor = 'Contraseña incorrecta repetida'; uAux.fechaDesactivacion = Date.now();
            await saveUsers(usersAux);
            try{ await registrarMovimiento(email, `🔒 Cuenta desactivada automáticamente por 4 intentos de contraseña incorrecta.`); }catch(e){}
            btn.disabled = false; btn.textContent = 'Entrar';
            msgEl.innerHTML = '<p style="color:var(--brick)">Demasiados intentos fallidos. Tu cuenta ha sido DESACTIVADA. Contacta a Soporte.</p>'; return;
          }
          await saveUsers(usersAux);
          btn.disabled = false; btn.textContent = 'Entrar';
          msgEl.innerHTML = uAux.intentosFallidos >= MAX_INTENTOS
            ? '<p style="color:var(--brick)">Contraseña incorrecta. ⚠️ Si falla una vez más, tu cuenta será DESACTIVADA.</p>'
            : '<p style="color:var(--brick)">Correo o contraseña incorrectos.</p>';
        } else {
          btn.disabled = false; btn.textContent = 'Entrar';
          msgEl.innerHTML = '<p style="color:var(--brick)">Correo o contraseña incorrectos.</p>';
        }
        return;
      }
      const users = await getUsersFresh();
      const u = users.find(x=>x.email===email);
      if(!u){ await auth.signOut(); btn.disabled=false; btn.textContent='Entrar'; msgEl.innerHTML = '<p style="color:var(--brick)">Usuario no encontrado. Contacta a Soporte.</p>'; return; }
      if(!u.activo && !esUsuarioAdmin(u)){
        u.intentosFallidos = 0; u.ultimaConexion = Date.now();
        await saveUsers(users);
        session = {email, tipo: u.tipo}; usuarioActual = u;
        currentTab = 'cuentaDesactivada';
        btn.disabled = false; btn.textContent = 'Entrar';
        toast('Tu cuenta está desactivada. Puedes contactar a Soporte.', 'warn');
        render(); return;
      }
      if(email === ADMIN_EMAIL && (!u.verificado || !u.telVerificado || !u.emailVerificado || !u.cedulaVerificada)){
        u.verificado = true; u.telVerificado = true; u.emailVerificado = true; u.cedulaVerificada = true; u.esAdmin = true;
      }
      u.intentosFallidos = 0; u.ultimaConexion = Date.now(); await saveUsers(users);
      session = {email, tipo: u.tipo}; usuarioActual = u;
      currentTab = (email === ADMIN_EMAIL) ? 'admin' : (u.tipo==='profesional' ? 'clientes' : 'buscar');
      if(email === ADMIN_EMAIL){
        try{
          const dirSnap = await db.collection('directorio').get();
          const yaEnDir = new Set(dirSnap.docs.map(d => d.id));
          const usAll = await getUsers();
          for(const usuario of usAll){
            if(!yaEnDir.has(safeId(usuario.email))){ await syncDirectorioPublico(usuario.email); }
          }
        }catch(e){}
      }
      if(u.notificacionReactivacion){ toast('✅ Tu cuenta ha sido reactivada por Soporte.', 'success'); u.notificacionReactivacion = 0; await saveUsers(users); }
      else { toast('¡Bienvenido/a!', 'success'); }
      render(); return;
    }

    const users = await getUsers();
    const u = users.find(x=>x.email===email);
    if(!u){ msgEl.innerHTML = '<p style="color:var(--brick)">Correo o contraseña incorrectos.</p>'; return; }
    const passCif = await hashPassword(pass);
    if(u.pass !== passCif){
      u.intentosFallidos = (u.intentosFallidos||0)+1;
      if(u.intentosFallidos >= MAX_INTENTOS_TOTAL){ u.activo = false; u.desactivadoPor = 'Contraseña incorrecta repetida'; u.fechaDesactivacion = Date.now(); await saveUsers(users); msgEl.innerHTML = '<p style="color:var(--brick)">Cuenta DESACTIVADA.</p>'; return; }
      await saveUsers(users);
      msgEl.innerHTML = u.intentosFallidos >= MAX_INTENTOS
        ? '<p style="color:var(--brick)">⚠️ Si falla una vez más, la cuenta se desactivará.</p>'
        : '<p style="color:var(--brick)">Correo o contraseña incorrectos.</p>';
      return;
    }
    if(!u.activo && !esUsuarioAdmin(u)){
      u.intentosFallidos = 0; u.ultimaConexion = Date.now(); await saveUsers(users);
      session = {email:u.email, tipo:u.tipo}; usuarioActual = u;
      currentTab = 'cuentaDesactivada';
      toast('Tu cuenta está desactivada.', 'warn');
      render(); return;
    }
    u.intentosFallidos = 0; u.ultimaConexion = Date.now(); await saveUsers(users);
    session = {email:u.email, tipo:u.tipo}; usuarioActual = u;
    currentTab = u.tipo==='profesional' ? 'clientes' : 'buscar';
    toast('¡Bienvenido/a!', 'success'); render();
  };
}

        const btn = document.getElementById('btnEnviarCalificacion');
        if(btn) btn.disabled = estrellasSel < 1;
      };
    });
  }
  const btnC = document.getElementById('btnCancelarCalificacion');
  if(btnC) btnC.onclick = ()=>{ calificandoTrabajoId = null; estrellasSel = 0; currentTab='trabajos'; render(); };
  const btnV = document.getElementById('btnVolverTrabajos');
  if(btnV) btnV.onclick = ()=>{ calificandoTrabajoId = null; estrellasSel = 0; currentTab='trabajos'; render(); };
  const btnE = document.getElementById('btnEnviarCalificacion');
  if(btnE) btnE.onclick = async ()=>{
    if(estrellasSel < 1){ toast('Selecciona al menos 1 estrella.', 'error'); return; }
    const com = document.getElementById('comentarioCal').value.trim();
    btnE.disabled = true; btnE.textContent = 'Enviando…';
    const res = await enviarCalificacion(calificandoTrabajoId, estrellasSel, com);
    calificandoTrabajoId = null; estrellasSel = 0;
    toast(res.mensaje, res.ok ? 'success' : 'error');
    currentTab = 'trabajos';
    render();
  };
}

async function enviarCalificacion(tid, n, com){
  try{
    const ts = await getTrabajos();
    const t = ts.find(x=>x.id===tid);
    if(!t) return { ok:false, mensaje:'Trabajo no encontrado.' };
    const otro = t.cliente===session.email ? t.profesional : t.cliente;
    const us = await getUsersFresh();
    const me = us.find(x=>x.email===session.email);
    const ot = us.find(u=>u.email===otro);
    if(ot){
      ot.calificaciones = ot.calificaciones||[];
      ot.calificaciones.push({estrellas:n, comentario:com, de:session.email, nombreDe: me ? nombreMostrar(me) : 'Usuario', fecha: Date.now(), trabajoId: tid});
      if(ot.tipo==='cliente' && ot.calificaciones.length >= 3){
        const p = ot.calificaciones.reduce((a,b)=>a+b.estrellas,0)/ot.calificaciones.length;
        if(p < 4){ ot.activo = false; ot.desactivadoPor = 'Calificación baja automática'; ot.fechaDesactivacion = Date.now(); }
      }
      await saveUsers(us);
      await syncDirectorioPublico(otro);
    }
    t.calificacionesHechas = t.calificacionesHechas || [];
    if(!t.calificacionesHechas.includes(session.email)) t.calificacionesHechas.push(session.email);

    let mensajeFinal = '¡Gracias por tu calificación!';
    if(t.calificacionesHechas.length >= 2){
      t.estado = 'completado';
      t.fechaCompletado = Date.now();
      try{ await avanzarHilo(convId(t.cliente, t.profesional)); }catch(e){}
      mensajeFinal = '🎉 ¡Trabajo completado! Ambos se calificaron. El chat quedó listo para un nuevo servicio.';
    } else {
      mensajeFinal = '✅ Calificación enviada. Esperando que la otra parte califique para cerrar el trabajo.';
    }
    await saveTrabajos(ts);
    return { ok:true, mensaje: mensajeFinal };
  }catch(e){
    console.error('enviarCalificacion:', e);
    return { ok:false, mensaje:'Error al calificar: ' + (e.message||e) };
  }
}

async function actualizarHilo(){

  if(!hE) return;
  const par = convId(session.email, chatWith);

let chatUnsubs = [];
function detenerListenerChat(){
  chatUnsubs.forEach(u => { try{ u(); }catch(e){} });
  chatUnsubs = [];
  if(chatPollTimer){ clearInterval(chatPollTimer); chatPollTimer = null; }
}
function iniciarListenerChat(){
  detenerListenerChat();
  if(!FIREBASE_LISTO || !session || !chatWith) return;
  try{
    const unsub1 = db.collection('mensajes').where('de','==',session.email).onSnapshot(
      () => { if(currentTab==='mensajes') actualizarHilo(); },
      (err) => console.warn('chat listener (de):', err.message)
    );
    const unsub2 = db.collection('mensajes').where('para','==',session.email).onSnapshot(
      () => { if(currentTab==='mensajes') actualizarHilo(); },
      (err) => console.warn('chat listener (para):', err.message)
    );
    chatUnsubs = [unsub1, unsub2];
  }catch(e){ console.error('iniciarListenerChat:', e); }
}

function wireMensajes(){
  if(chatPollTimer){ clearInterval(chatPollTimer); chatPollTimer = null; }
  const lv = document.getElementById('linkVerif2'); if(lv) lv.onclick = (e)=>{ e.preventDefault(); currentTab='verificacion'; render(); };
  document.querySelectorAll('[data-conv]').forEach(p=>{ p.onclick = async ()=>{ chatWith = p.dataset.conv; await marcarMensajesLeidos(chatWith, session.email); reportando=false; render(); }; });
  document.querySelectorAll('[data-tpl]').forEach(b=>{ b.onclick = ()=>{ const i = document.getElementById('nuevoMsg'); if(i){ i.value = b.dataset.tpl; i.focus(); } }; });
  const enviar = async ()=>{
    const input = document.getElementById('nuevoMsg');
    if(!input) return;
    const texto = input.value.trim();
    if(!texto) return;
    const par = convId(session.email, chatWith);
    const hi = await obtenerHiloActual(par);
    await addMensaje({de:session.email, para:chatWith, texto, fecha:Date.now(), hilo:hi, leido:false});
    input.value = '';
    await render();
    const ni = document.getElementById('nuevoMsg');
    if(ni){ ni.focus(); ni.selectionStart = ni.selectionEnd = ni.value.length; const hE = document.getElementById('hilo'); if(hE) hE.scrollTop = hE.scrollHeight; }
  };
  const bE = document.getElementById('btnEnviar'); if(bE) bE.onclick = enviar;
  const iM = document.getElementById('nuevoMsg');
  if(iM){ iM.onkeydown = (e)=>{ if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); enviar(); } }; setTimeout(()=>{ iM.focus(); const hE = document.getElementById('hilo'); if(hE) hE.scrollTop = hE.scrollHeight; }, 100); }

  const bT = document.getElementById('btnMarcarTrabajo');
  if(bT){
    bT.onclick = async ()=>{
      bT.disabled = true; bT.textContent = 'Creando trabajo…';
      const ts = await getTrabajos();
      const ee = ts.filter(t=>t.cliente===session.email && t.profesional===chatWith);
      const p = ee.find(t=>t.estado!=='completado' && t.estado!=='cancelado');
      if(p){
        calificandoTrabajoId = p.id; estrellasSel = 0;
        currentTab = 'calificar'; render(); return;
      }
      if(ee.filter(t=>t.estado==='completado').length >= 3){ toast('Máximo de trabajos entre la misma pareja.', 'error'); bT.disabled=false; bT.textContent='🛠️ Marcar trabajo como realizado'; return; }
      const nid = 't'+Date.now();
      ts.push({id:nid, cliente: session.email, profesional: chatWith, estado:'confirmado', calificacionesHechas:[], fecha: Date.now()});
      await saveTrabajos(ts);
      calificandoTrabajoId = nid; estrellasSel = 0;
      currentTab = 'calificar';
      toast('¡Trabajo registrado! Califica a ' + chatWith, 'success');
      render();
    };
  }

  const bIC = document.getElementById('btnIrCalificarTrabajo');
  if(bIC){ bIC.onclick = ()=>{ calificandoTrabajoId = bIC.dataset.tid; estrellasSel = 0; currentTab='calificar'; render(); }; }

  const bR = document.getElementById('btnReportar'); if(bR) bR.onclick = ()=>{ reportando = true; render(); };
  const bCR = document.getElementById('btnCancelarReporte'); if(bCR) bCR.onclick = ()=>{ reportando = false; render(); };
  const bER = document.getElementById('btnEnviarReporte');
  if(bER){ bER.onclick = async ()=>{ const m = document.getElementById('motivoReporte').value.trim(); if(!m){ toast('Describe el problema.', 'error'); return; } const rs = await getReportes(); rs.push({id:'r'+Date.now(), de:session.email, contra:chatWith, motivo:m, fecha:Date.now(), estado:'pendiente'}); await saveReportes(rs); reportando = false; toast('Reporte enviado.', 'success'); render(); }; }
  if(chatWith){
    if(FIREBASE_LISTO){ iniciarListenerChat(); }
    else { chatPollTimer = setInterval(actualizarHilo, 4000); }
    marcarMensajesLeidos(chatWith, session.email).then(()=>actualizarCampana());
  }
}

        }catch(e){}
      }
      try{ await registrarMovimiento(nEmail, `✏️ El admin actualizó tus datos: ${cambios.join(', ') || 'sin cambios'}.`); }catch(e){}
      await syncDirectorioPublico(nEmail);
      toast('Datos actualizados.', 'success');
      adminEditandoEmail = null;
      render();
    };
  });
  document.querySelectorAll('[data-eliminar-usuario]').forEach(b=>{
    b.onclick = async ()=>{
      const email = b.dataset.eliminarUsuario;
      const confirmacion = confirm('¿Eliminar permanentemente a ' + email + ' de Firestore?\n\nTambién debes borrarlo en Firebase Console → Authentication.');
      if(!confirmacion) return;
      b.disabled = true; b.textContent = 'Eliminando...';
      try{
        await db.collection('usuarios').doc(safeId(email)).delete();
        try{ await db.collection('privado').doc(safeId(email)).delete(); }catch(e){}
        try{ await db.collection('directorio').doc(safeId(email)).delete(); }catch(e){}
        toast('✅ Usuario eliminado.', 'success');
        render();
      }catch(e){
        toast('Error al eliminar: ' + (e.message||e), 'error');
        b.disabled = false; b.textContent = '🗑️ Eliminar';
      }
    };
  });
}

function wireFabArrastrable(){
  const fab = document.getElementById('fabSoporte');
  if(!fab) return;
  const guardado = localStorage.getItem('fabPos');
  if(guardado){
    try{
      const p = JSON.parse(guardado);
      if(p && typeof p.x === 'number' && typeof p.y === 'number'){
        fab.style.left = p.x + 'px'; fab.style.top = p.y + 'px';
        fab.style.right = 'auto'; fab.style.bottom = 'auto';
      }
    }catch(e){}
  }
  let arrastrando = false, sx = 0, sy = 0, ox = 0, oy = 0, movido = false;
  const getXY = (e) => e.touches ? {x: e.touches[0].clientX, y: e.touches[0].clientY} : {x: e.clientX, y: e.clientY};
  const onDown = (e)=>{
    const p = getXY(e);
    const r = fab.getBoundingClientRect();
    sx = p.x; sy = p.y; ox = r.left; oy = r.top;
    arrastrando = true; movido = false;
    fab.classList.add('arrastrando');
  };
  const onMove = (e)=>{
    if(!arrastrando) return;
    const p = getXY(e);
    const dx = p.x - sx; const dy = p.y - sy;
    if(Math.abs(dx) > 4 || Math.abs(dy) > 4) movido = true;
    const nx = Math.max(8, Math.min(window.innerWidth - 70, ox + dx));
    const ny = Math.max(8, Math.min(window.innerHeight - 70, oy + dy));
    fab.style.left = nx + 'px'; fab.style.top = ny + 'px';
    fab.style.right = 'auto'; fab.style.bottom = 'auto';
    if(e.cancelable) e.preventDefault();
  };
  const onUp = ()=>{
    if(!arrastrando) return;
    arrastrando = false;
    fab.classList.remove('arrastrando');
    const r = fab.getBoundingClientRect();
    try{ localStorage.setItem('fabPos', JSON.stringify({x: r.left, y: r.top})); }catch(e){}
    if(!movido && session){ abrirSoporte(); }
  };
  fab.addEventListener('mousedown', onDown);
  window.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onUp);
  fab.addEventListener('touchstart', onDown, {passive: true});
  window.addEventListener('touchmove', onMove, {passive: false});
  window.addEventListener('touchend', onUp);
}

async function render(){
  if(currentTab !== 'mensajes'){
    if(chatPollTimer){ clearInterval(chatPollTimer); chatPollTimer = null; }
    detenerListenerChat();
  }
  if(mostrarOnboarding()){ renderTabs(); document.getElementById('app').innerHTML = renderOnboarding(); wireOnboarding(); document.getElementById('sessionInfo').innerHTML = ''; document.getElementById('dbFooterStatus').innerHTML = ''; return; }
  renderTabs();
  const app = document.getElementById('app');
  app.innerHTML = '<div class="card"><div class="skeleton" style="width:70%"></div><div class="skeleton" style="width:90%"></div></div>';
  if(!session && (currentTab==='perfil'||currentTab==='mensajes'||currentTab==='admin'||currentTab==='verificacion'||currentTab==='soporte'||currentTab==='favoritos'||currentTab==='trabajos'||currentTab==='clientes'||currentTab==='cuentaDesactivada'||currentTab==='calificar')) currentTab = 'login';

  if(session && !esAdmin(session)){
    try{
      const users = await getUsersFresh();
      const u = users.find(x=>x.email===session.email);
      if(u) usuarioActual = u;
    }catch(e){}
  }

  if(session && !esAdmin(session) && usuarioActual && usuarioActual.activo === false){
    const permitidos = ['cuentaDesactivada','mensajes','soporte','terminos','privacidad'];
    if(!permitidos.includes(currentTab)) currentTab = 'cuentaDesactivada';
  }
  if(session && !esAdmin(session) && (!usuarioActual || usuarioActual.activo !== false)){
    if(usuarioActual && !estaVerificado(usuarioActual) && currentTab !== 'soporte'){
      if(currentTab !== 'mensajes' || (chatWith && !esEmailAdmin2(chatWith))){
        currentTab = 'verificacion';
      }
    }
  }
  try{
    if(currentTab==='registro'){ app.innerHTML = viewRegistro(); wireRegistro(); }
    else if(currentTab==='terminos'){ app.innerHTML = viewTerminos(); const lp = document.getElementById('linkPrivacidad'); if(lp) lp.onclick = (e)=>{ e.preventDefault(); currentTab='privacidad'; render(); }; }
    else if(currentTab==='privacidad'){ app.innerHTML = viewPrivacidad(); }
    else if(currentTab==='login'){ app.innerHTML = viewLogin(); wireLogin(); }
    else if(currentTab==='cuentaDesactivada'){ usuarioActual = usuarioActual || (await getUsersFresh()).find(x=>x.email===session.email); app.innerHTML = viewCuentaDesactivada(); wireCuentaDesactivada(); }
    else if(currentTab==='verificacion'){ const us = await getUsersFresh(); const u = us.find(x=>x.email===session.email); if(u){ app.innerHTML = viewVerificacion(u); wireVerificacion(u); } else { app.innerHTML = '<p class="empty">Usuario no encontrado.</p>'; } }
    else if(currentTab==='buscar'){ app.innerHTML = await viewBuscar(); wireBuscar(); }
    else if(currentTab==='clientes'){ app.innerHTML = await viewClientes(); wireClientes(); }
    else if(currentTab==='favoritos'){ app.innerHTML = await viewFavoritos(); wireBotonesLista(); }
    else if(currentTab==='trabajos'){ app.innerHTML = await viewMisTrabajos(); wireMisTrabajos(); }
    else if(currentTab==='perfil'){ app.innerHTML = await viewPerfil(); wirePerfil(); }
    else if(currentTab==='mensajes'){ app.innerHTML = await viewMensajes(); wireMensajes(); }
    else if(currentTab==='soporte'){ abrirSoporte(); return; }
    else if(currentTab==='calificar'){ app.innerHTML = await viewCalificar(); wireCalificar(); }
    else if(currentTab==='admin'){ app.innerHTML = await viewAdmin(); wireAdmin(); }
  }catch(err){ app.innerHTML = `<div class="card"><p style="color:var(--brick)">Error: ${err.message||err}</p></div>`; console.error(err); }
  wireAyuda();
  app.classList.remove('fadein');
  void app.offsetWidth;
  app.classList.add('fadein');
}

    if(prev){

          auth.onAuthStateChanged(async (user)=>{

              const users = await getUsersFresh();
              const uFire = users.find(x=>x.email===normalizarEmail(user.email));
              if(uFire && user.emailVerified && !uFire.emailVerificado){
                uFire.emailVerificado = true;
                await saveUsers(users);
              }
              session = {email: normalizarEmail(user.email), tipo: uFire ? uFire.tipo : p.tipo};

          const allU = await getUsersFresh();
          usuarioActual = allU.find(x=>x.email===p.email) || null;
        }
      }
    }
  }catch(e){}
  render();
})();
